; bot-hq in one container. PID 1 is supervisord (started by docker/entrypoint.sh).
; Debian's /etc/supervisor/supervisord.conf includes this file; its [supervisord]/[unix_http_server]
; sections (socket /var/run/supervisor.sock) are what `supervisorctl` uses.
; Every program logs to /var/log/hq/sv-<name>.log (the box scripts write their own *.log files there too).
; Only the server publishes a port to the host (see docker-compose.yml); everything else is loopback.

[program:dbus]
priority=10
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
stdout_logfile=/var/log/hq/sv-dbus.log
stderr_logfile=/var/log/hq/sv-dbus.log

; The screens (Xvfb + XFCE + x11vnc for :99, :100, ...) are not here: docker/entrypoint.sh writes them
; to /etc/supervisor/conf.d/hq-displays.conf, one set per screen up to MAX_BOTS (at most 4). :99 starts
; with the container; the others start when a bot first needs its screen (server/src/computer.ts).

[program:hq-home]
priority=50
command=python3 %(ENV_HQ_ROOT)s/hq-home.py
autorestart=true
startsecs=2
stdout_logfile=/var/log/hq/sv-hq-home.log
stderr_logfile=/var/log/hq/sv-hq-home.log

[program:hermes]
priority=60
; The primary bot's gateway. Its API server settings come from /root/.hermes/.env (docker/entrypoint.sh).
command=hermes gateway run --no-supervise
environment=HERMES_HOME="/root/.hermes"
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/var/log/hq/sv-hermes.log
stderr_logfile=/var/log/hq/sv-hermes.log

[program:server]
priority=70
; Start once the primary gateway answers (or after 120s regardless, so the UI still comes up).
command=bash -c 'for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8642/health >/dev/null 2>&1 && break; sleep 1; done; exec node /opt/hq/app/server/dist/index.js'
directory=/opt/hq/app
environment=HQ_LOCAL="1",HOST="0.0.0.0",PORT="8787",HQ_HOME_SUPERVISOR="hq-home",HERMES_HOME="/root/.hermes"
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/var/log/hq/sv-server.log
stderr_logfile=/var/log/hq/sv-server.log
